<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0e17" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ChargeVault" />
<title>ChargeVault 20 · Event Charging</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2310b981'/%3E%3Cpath d='M36 8 16 36h14l-4 20 22-30H34z' fill='%23052e16'/%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #0a0e17;
    --bg-2: #0f1522;
    --surface: #141b2b;
    --surface-2: #1a2336;
    --border: #243049;
    --border-soft: rgba(255, 255, 255, 0.06);
    --text: #f1f5f9;
    --muted: #8b9ab3;
    --dim: #5b6a84;

    --green: #22c55e;
    --green-soft: rgba(34, 197, 94, 0.12);
    --green-text: #4ade80;
    --amber: #f59e0b;
    --amber-soft: rgba(245, 158, 11, 0.12);
    --amber-text: #fbbf24;
    --red: #ef4444;
    --red-soft: rgba(239, 68, 68, 0.14);
    --red-text: #f87171;
    --blue: #38bdf8;
    --blue-soft: rgba(56, 189, 248, 0.14);

    --radius: 16px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html { background: var(--bg); }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Inter, sans-serif;
    background:
      radial-gradient(1200px 500px at 50% -200px, rgba(34, 197, 94, 0.10), transparent 70%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    padding-bottom: calc(96px + var(--safe-b));
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }

  button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  .wrap { max-width: 960px; margin: 0 auto; }

  /* ---------- Header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(10, 14, 23, 0.86);
    backdrop-filter: saturate(160%) blur(14px);
    -webkit-backdrop-filter: saturate(160%) blur(14px);
    border-bottom: 1px solid var(--border-soft);
    padding: calc(12px + var(--safe-t)) 16px 12px;
  }

  .top-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }

  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo {
    width: 38px; height: 38px; flex: none;
    border-radius: 11px;
    background: linear-gradient(145deg, #34d399, #16a34a);
    display: grid; place-items: center;
    box-shadow: 0 6px 18px rgba(34, 197, 94, 0.35);
  }
  .logo svg { width: 20px; height: 20px; }
  .brand-text h1 { font-size: 1.08rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .brand-text p { font-size: 0.72rem; color: var(--muted); margin-top: 2px; display: flex; align-items: center; gap: 6px; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 0 rgba(34,197,94,.6); animation: live 2s infinite; }
  @keyframes live { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,.55); } 70% { box-shadow: 0 0 0 7px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }

  .icon-btn {
    width: 42px; height: 42px; flex: none;
    display: grid; place-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--muted);
  }
  .icon-btn:active { background: var(--surface-2); color: var(--text); }
  .icon-btn svg { width: 20px; height: 20px; }
  .header-actions { display: flex; gap: 8px; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 12px;
    position: relative;
    overflow: hidden;
  }
  .stat::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--c); }
  .stat .val { font-size: 1.45rem; font-weight: 800; letter-spacing: -0.03em; color: var(--c); line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat .lbl { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; margin-top: 2px; }
  .stat.free { --c: var(--green-text); }
  .stat.busy { --c: var(--amber-text); }
  .stat.over { --c: var(--red-text); }

  /* ---------- Toolbar ---------- */
  .toolbar { padding: 14px 16px 2px; display: flex; flex-direction: column; gap: 10px; }

  .search {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0 12px;
  }
  .search svg { width: 18px; height: 18px; color: var(--dim); flex: none; }
  .search input {
    flex: 1; min-width: 0;
    background: none; border: none; color: var(--text);
    font-size: 16px; padding: 12px 0;
  }
  .search input::placeholder { color: var(--dim); }
  .search input:focus { outline: none; }
  .search:focus-within { border-color: var(--blue); }
  .clear-search { color: var(--dim); font-size: 1.2rem; padding: 4px; display: none; }
  .search.has-text .clear-search { display: block; }

  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 0.84rem;
    font-weight: 600;
    white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip .n { font-size: 0.72rem; background: var(--border); color: var(--text); border-radius: 999px; padding: 1px 7px; font-variant-numeric: tabular-nums; }
  .chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .chip.active .n { background: var(--bg); color: var(--text); }

  /* ---------- Grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    padding: 12px 16px;
  }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (min-width: 820px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

  .bay {
    position: relative;
    text-align: left;
    border-radius: var(--radius);
    padding: 12px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    display: flex; flex-direction: column;
    min-height: 138px;
    transition: transform 0.1s ease, border-color 0.2s;
    overflow: hidden;
  }
  .bay:active { transform: scale(0.97); }

  .bay-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .bay-num { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; }
  .bay-num small { font-size: 0.62rem; font-weight: 700; color: var(--muted); letter-spacing: 0.08em; display: block; margin-bottom: 3px; }
  .badge {
    font-size: 0.64rem; font-weight: 800; letter-spacing: 0.05em;
    padding: 4px 8px; border-radius: 999px; text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* Free */
  .bay.free { background: linear-gradient(160deg, rgba(34,197,94,0.10), rgba(34,197,94,0.03)); border-color: rgba(34,197,94,0.32); border-style: dashed; }
  .bay.free .badge { background: var(--green-soft); color: var(--green-text); }
  .free-cta { margin-top: auto; display: flex; align-items: center; gap: 8px; color: var(--green-text); font-weight: 700; font-size: 0.88rem; }
  .free-cta .plus { width: 28px; height: 28px; border-radius: 50%; background: var(--green); color: #052e16; display: grid; place-items: center; font-size: 1.2rem; font-weight: 800; line-height: 1; }

  /* Charging */
  .bay.charging { background: linear-gradient(160deg, rgba(245,158,11,0.13), rgba(245,158,11,0.04)); border-color: rgba(245,158,11,0.55); }
  .bay.charging .badge { background: var(--amber-soft); color: var(--amber-text); }

  /* Overdue */
  .bay.overdue { background: linear-gradient(160deg, rgba(239,68,68,0.20), rgba(239,68,68,0.06)); border-color: var(--red); animation: pulse 1.8s infinite; }
  .bay.overdue .badge { background: var(--red-soft); color: var(--red-text); }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,.4); } 50% { box-shadow: 0 0 0 6px rgba(239,68,68,0); } }

  .bay-customer { font-size: 0.98rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bay-device { font-size: 0.76rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

  .bay-bottom { margin-top: auto; padding-top: 10px; }
  .meter { height: 6px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; }
  .meter > span { display: block; height: 100%; border-radius: inherit; background: var(--amber); transition: width 0.6s ease; }
  .overdue .meter > span { background: var(--red); }
  .meter.full > span { width: 40%; background: linear-gradient(90deg, transparent, var(--amber), transparent); animation: sweep 1.8s linear infinite; }
  @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  .bay-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 7px; font-size: 0.74rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .bay-meta .time { color: var(--amber-text); }
  .overdue .bay-meta .time { color: var(--red-text); }
  .bay-meta .paid { color: var(--muted); }

  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 40px 16px; font-size: 0.9rem; }
  .empty strong { display: block; color: var(--text); font-size: 1rem; margin-bottom: 4px; }

  /* ---------- Bottom bar ---------- */
  .bottom-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
    background: rgba(10, 14, 23, 0.92);
    backdrop-filter: saturate(160%) blur(14px);
    -webkit-backdrop-filter: saturate(160%) blur(14px);
    border-top: 1px solid var(--border-soft);
    padding: 10px 16px calc(10px + var(--safe-b));
  }
  .bottom-inner { max-width: 960px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
  .rev-total .lbl, .rev-sub .lbl { font-size: 0.64rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  .rev-total .val { font-size: 1.5rem; font-weight: 800; color: var(--green-text); letter-spacing: -0.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .rev-subs { display: flex; gap: 14px; padding-left: 14px; border-left: 1px solid var(--border); }
  .rev-sub .val { font-size: 0.95rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .bottom-inner .icon-btn { margin-left: auto; }

  /* ---------- Sheets / modals ---------- */
  .backdrop {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(2, 6, 14, 0.72);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 24px 24px 0 0;
    width: 100%; max-width: 480px;
    max-height: 92vh; max-height: 92dvh;
    overflow-y: auto;
    padding: 8px 18px calc(22px + var(--safe-b));
    transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(.2,.9,.3,1);
    overscroll-behavior: contain;
  }
  .backdrop.open .sheet { transform: translateY(0); }
  @media (min-width: 640px) {
    .backdrop { align-items: center; }
    .sheet { border-radius: 22px; border-bottom: 1px solid var(--border); transform: translateY(20px) scale(0.98); }
    .backdrop.open .sheet { transform: none; }
  }
  .grabber { width: 40px; height: 5px; border-radius: 999px; background: var(--border); margin: 4px auto 12px; }
  @media (min-width: 640px) { .grabber { visibility: hidden; height: 0; margin: 6px auto; } }

  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; }
  .sheet-head h2 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; }
  .sheet-head p { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
  .close-btn { width: 36px; height: 36px; flex: none; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); color: var(--muted); font-size: 1.25rem; display: grid; place-items: center; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 0.72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 7px; }
  .field input {
    width: 100%;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    color: var(--text);
    font-size: 16px;
  }
  .field input::placeholder { color: var(--dim); }
  .field input:focus { outline: none; border-color: var(--blue); background: var(--surface-2); }
  .field.error input { border-color: var(--red); }
  .field .err { display: none; color: var(--red-text); font-size: 0.78rem; margin-top: 6px; font-weight: 600; }
  .field.error .err { display: block; }

  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .opt {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 12px;
    text-align: left;
    min-height: 56px;
    transition: border-color 0.15s, background 0.15s;
  }
  .opt .big { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.02em; display: block; }
  .opt .small { font-size: 0.76rem; color: var(--muted); font-weight: 600; }
  .opt.center { text-align: center; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .opt.selected { border-color: var(--blue); background: var(--blue-soft); }
  .opt.selected .big, .opt.selected.center { color: var(--blue); }

  .btn {
    width: 100%;
    border-radius: 14px;
    padding: 16px;
    font-size: 1.02rem;
    font-weight: 800;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform 0.1s, filter 0.15s;
  }
  .btn:active { transform: scale(0.98); filter: brightness(0.92); }
  .btn-go { background: var(--green); color: #052e16; box-shadow: 0 8px 24px rgba(34,197,94,0.25); }
  .btn-red { background: var(--red); color: #fff; }
  .btn-soft { background: var(--surface); border: 1px solid var(--border); color: var(--text); font-weight: 700; }
  .btn + .btn { margin-top: 10px; }
  .btn svg { width: 18px; height: 18px; }

  .code-card {
    text-align: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .code-card .lbl { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
  .code-card .code { font-size: 2.6rem; font-weight: 800; letter-spacing: 0.2em; margin: 4px 0 2px; padding-left: 0.2em; font-variant-numeric: tabular-nums; color: var(--blue); }
  .code-card .hint { font-size: 0.78rem; color: var(--muted); }

  .success-ic { width: 64px; height: 64px; border-radius: 50%; background: var(--green-soft); color: var(--green-text); display: grid; place-items: center; margin: 4px auto 12px; }
  .success-ic svg { width: 32px; height: 32px; }

  .status-banner {
    display: flex; justify-content: space-between; align-items: center;
    border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; font-weight: 700;
  }
  .status-banner.charging { background: var(--amber-soft); color: var(--amber-text); border: 1px solid rgba(245,158,11,0.35); }
  .status-banner.overdue { background: var(--red-soft); color: var(--red-text); border: 1px solid rgba(239,68,68,0.45); }
  .status-banner .t { font-size: 1.2rem; font-variant-numeric: tabular-nums; }

  .details { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 4px 14px; margin-bottom: 12px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--border-soft); font-size: 0.9rem; }
  .row:last-child { border-bottom: none; }
  .row span { color: var(--muted); flex: none; }
  .row strong { text-align: right; word-break: break-word; }

  .note { display: flex; gap: 10px; font-size: 0.8rem; color: var(--muted); line-height: 1.45; background: var(--blue-soft); border: 1px solid rgba(56,189,248,0.25); border-radius: 12px; padding: 10px 12px; margin-bottom: 14px; }
  .note svg { width: 18px; height: 18px; flex: none; color: var(--blue); margin-top: 1px; }

  /* History */
  .sum-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .sum { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px; }
  .sum .v { font-size: 1.05rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .sum .l { font-size: 0.64rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  .log { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .log-item { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 11px 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 0.86rem; }
  .log-item .sub { color: var(--muted); font-size: 0.74rem; margin-top: 2px; }
  .log-item .amt { text-align: right; flex: none; }
  .log-item .amt strong { color: var(--green-text); }
  .muted-center { color: var(--muted); font-size: 0.88rem; text-align: center; padding: 24px 0; }
  .section-lbl { font-size: 0.7rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 4px 0 8px; }

  /* Toast */
  .toast {
    position: fixed; left: 50%; z-index: 80;
    top: calc(14px + var(--safe-t));
    transform: translate(-50%, -20px);
    opacity: 0; pointer-events: none;
    background: var(--text); color: var(--bg);
    border-radius: 14px; padding: 12px 14px 12px 16px;
    display: flex; align-items: center; gap: 14px;
    font-size: 0.9rem; font-weight: 700;
    width: max-content; max-width: calc(100vw - 32px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    transition: opacity 0.2s, transform 0.25s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button { color: #0369a1; font-weight: 800; padding: 4px 6px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="top-row">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="#052e16"><path d="M13.5 1.5 4 13.5h6.5l-1.5 9 9.5-12H12z"/></svg>
        </div>
        <div class="brand-text">
          <h1>ChargeVault 20</h1>
          <p><span class="live-dot"></span><span id="clock">--:--</span> · Saved on this phone</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="openHistory()" aria-label="Shift log">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
        </button>
        <button class="icon-btn" onclick="exportCSV()" aria-label="Export CSV">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        </button>
      </div>
    </div>
    <div class="stats">
      <div class="stat free"><div class="val" id="statFree">20</div><div class="lbl">Open</div></div>
      <div class="stat busy"><div class="val" id="statBusy">0</div><div class="lbl">Charging</div></div>
      <div class="stat over"><div class="val" id="statOver">0</div><div class="lbl">Overdue</div></div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="toolbar">
    <div class="search" id="searchBox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="searchInput" type="search" inputmode="search" placeholder="Find by name, phone, code or bay" autocomplete="off" oninput="onSearch(this.value)" />
      <button class="clear-search" onclick="clearSearch()" aria-label="Clear search">&times;</button>
    </div>
    <div class="chips" id="chips">
      <button class="chip active" data-filter="all" onclick="setFilter('all')">All <span class="n" id="cAll">20</span></button>
      <button class="chip" data-filter="free" onclick="setFilter('free')">Open <span class="n" id="cFree">20</span></button>
      <button class="chip" data-filter="busy" onclick="setFilter('busy')">Occupied <span class="n" id="cBusy">0</span></button>
      <button class="chip" data-filter="overdue" onclick="setFilter('overdue')">Overdue <span class="n" id="cOver">0</span></button>
    </div>
  </div>

  <main class="grid" id="bayGrid"></main>
</div>

<div class="bottom-bar">
  <div class="bottom-inner">
    <div class="rev-total"><div class="lbl">Shift total</div><div class="val" id="revTotal">R0</div></div>
    <div class="rev-subs">
      <div class="rev-sub"><div class="lbl">Cash</div><div class="val" id="revCash">R0</div></div>
      <div class="rev-sub"><div class="lbl">Card / QR</div><div class="val" id="revCard">R0</div></div>
    </div>
    <button class="icon-btn" onclick="openHistory()" aria-label="Open shift log">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    </button>
  </div>
</div>

<!-- Bay sheet -->
<div class="backdrop" id="bayModal" onclick="if (event.target === this) closeSheet('bayModal')">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="grabber"></div>
    <div class="sheet-head">
      <div><h2 id="modalTitle">Bay 01</h2><p id="modalSub"></p></div>
      <button class="close-btn" onclick="closeSheet('bayModal')" aria-label="Close">&times;</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<!-- History sheet -->
<div class="backdrop" id="historyModal" onclick="if (event.target === this) closeSheet('historyModal')">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="histTitle">
    <div class="grabber"></div>
    <div class="sheet-head">
      <div><h2 id="histTitle">Shift log</h2><p id="histSub"></p></div>
      <button class="close-btn" onclick="closeSheet('historyModal')" aria-label="Close">&times;</button>
    </div>
    <div id="historyBody"></div>
  </div>
</div>

<!-- Confirm sheet -->
<div class="backdrop" id="confirmModal" onclick="if (event.target === this) answerConfirm(false)">
  <div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="grabber"></div>
    <div class="sheet-head"><div><h2 id="confirmTitle">Are you sure?</h2><p id="confirmMsg"></p></div></div>
    <button class="btn btn-red" id="confirmOk" onclick="answerConfirm(true)">Confirm</button>
    <button class="btn btn-soft" onclick="answerConfirm(false)">Cancel</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastAction" hidden></button></div>

<script>
const STORAGE_KEY = 'chargevault_20_state_v1';
const BAY_COUNT = 20;
const TIERS = {
  hour: { label: 'R30 (1 Hr)', price: 30, mins: 60 },
  full: { label: 'R50 (Full)', price: 50, mins: 0 }
};
const EXTEND = { price: 30, mins: 60 };

function blankBay(id) {
  return { id, occupied: false, customer: '', device: '', tierLabel: '', price: 0, durationMins: 0, paymentMethod: 'Cash', checkInTime: null, code: '' };
}

let state = { bays: Array.from({ length: BAY_COUNT }, (_, i) => blankBay(i + 1)), history: [] };

let currentFilter = 'all';
let searchTerm = '';
let selectedBayId = null;
let formTier = TIERS.hour;
let formPay = 'Cash';
let lastRelease = null;
let toastTimer = null;

/* ---------- Storage ---------- */
function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (parsed && Array.isArray(parsed.bays) && parsed.bays.length === BAY_COUNT) {
        parsed.history = Array.isArray(parsed.history) ? parsed.history : [];
        state = parsed;
      }
    }
  } catch (e) { console.error('Failed to load saved state', e); }
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (e) { console.error('Failed to save state', e); showToast('Could not save. Storage may be full.'); }
}

/* ---------- Helpers ---------- */
const pad = n => String(n).padStart(2, '0');
function formatTime(ts) { if (!ts) return '--:--'; const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtMins(m) { m = Math.max(0, Math.round(m)); if (m < 60) return `${m}m`; const h = Math.floor(m / 60), r = m % 60; return r ? `${h}h ${r}m` : `${h}h`; }
function escapeHtml(str) {
  return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function vibrate(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

function newCode() {
  const used = new Set(state.bays.filter(b => b.occupied).map(b => b.code));
  let c;
  do { c = String(Math.floor(100 + Math.random() * 900)); } while (used.has(c));
  return c;
}

function getBayStatus(bay) {
  if (!bay.occupied) return { status: 'free', label: 'Open', text: '', pct: 0 };
  const elapsed = (Date.now() - bay.checkInTime) / 60000;
  if (!bay.durationMins) {
    return { status: 'charging', label: 'Full chg', text: `${fmtMins(elapsed)} in`, pct: -1, elapsed };
  }
  const left = bay.durationMins - elapsed;
  const pct = Math.min(100, (elapsed / bay.durationMins) * 100);
  if (left <= 0) return { status: 'overdue', label: 'Overdue', text: `+${fmtMins(-left)} over`, pct: 100, elapsed };
  return { status: 'charging', label: 'Charging', text: `${fmtMins(Math.ceil(left))} left`, pct, elapsed };
}

function matchesSearch(bay) {
  if (!searchTerm) return true;
  const q = searchTerm.toLowerCase();
  return String(bay.id) === q.replace(/^0+/, '') ||
    (bay.customer || '').toLowerCase().includes(q) ||
    (bay.device || '').toLowerCase().includes(q) ||
    (bay.code && bay.code === q);
}

/* ---------- Render ---------- */
function setFilter(filter) {
  currentFilter = filter;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.filter === filter));
  render();
}

function onSearch(v) {
  searchTerm = v.trim();
  document.getElementById('searchBox').classList.toggle('has-text', !!v);
  render();
}
function clearSearch() { const i = document.getElementById('searchInput'); i.value = ''; onSearch(''); i.blur(); }

function render() {
  const grid = document.getElementById('bayGrid');
  let free = 0, busy = 0, over = 0;
  const cards = [];

  state.bays.forEach(bay => {
    const info = getBayStatus(bay);
    if (info.status === 'free') free++;
    else { busy++; if (info.status === 'overdue') over++; }

    if (currentFilter === 'free' && info.status !== 'free') return;
    if (currentFilter === 'busy' && info.status === 'free') return;
    if (currentFilter === 'overdue' && info.status !== 'overdue') return;
    if (searchTerm && !matchesSearch(bay)) return;

    if (!bay.occupied) {
      cards.push(`
        <button class="bay free" onclick="openBay(${bay.id})" aria-label="Bay ${bay.id}, open. Tap to check in">
          <div class="bay-top">
            <div class="bay-num"><small>BAY</small>${pad(bay.id)}</div>
            <span class="badge">Open</span>
          </div>
          <div class="free-cta"><span class="plus">+</span>Check in</div>
        </button>`);
    } else {
      const meter = info.pct < 0
        ? `<div class="meter full"><span></span></div>`
        : `<div class="meter"><span style="width:${info.pct.toFixed(1)}%"></span></div>`;
      cards.push(`
        <button class="bay ${info.status}" onclick="openBay(${bay.id})" aria-label="Bay ${bay.id}, ${escapeHtml(bay.customer)}, ${info.text}">
          <div class="bay-top">
            <div class="bay-num"><small>BAY</small>${pad(bay.id)}</div>
            <span class="badge">${info.label}</span>
          </div>
          <div class="bay-customer">${escapeHtml(bay.customer)}</div>
          <div class="bay-device">${escapeHtml(bay.device || 'No device note')}</div>
          <div class="bay-bottom">
            ${meter}
            <div class="bay-meta"><span class="time">${info.text}</span><span class="paid">R${bay.price} · ${bay.paymentMethod === 'Cash' ? 'Cash' : 'Card'}</span></div>
          </div>
        </button>`);
    }
  });

  grid.innerHTML = cards.length ? cards.join('') :
    `<div class="empty"><strong>${searchTerm ? 'No match' : 'Nothing here'}</strong>${searchTerm ? 'Try the customer name, phone, pickup code or bay number.' : 'No bays in this view right now.'}</div>`;

  document.getElementById('statFree').textContent = free;
  document.getElementById('statBusy').textContent = busy;
  document.getElementById('statOver').textContent = over;
  document.getElementById('cAll').textContent = BAY_COUNT;
  document.getElementById('cFree').textContent = free;
  document.getElementById('cBusy').textContent = busy;
  document.getElementById('cOver').textContent = over;
  document.getElementById('clock').textContent = formatTime(Date.now());

  updateRevenue();
}

function totals() {
  let cash = 0, card = 0;
  state.bays.forEach(b => { if (b.occupied) { if (b.paymentMethod === 'Cash') cash += b.price; else card += b.price; } });
  state.history.forEach(h => { if (h.paymentMethod === 'Cash') cash += h.price; else card += h.price; });
  return { cash, card, total: cash + card };
}

function updateRevenue() {
  const t = totals();
  document.getElementById('revTotal').textContent = `R${t.total}`;
  document.getElementById('revCash').textContent = `R${t.cash}`;
  document.getElementById('revCard').textContent = `R${t.card}`;
}

/* ---------- Sheets ---------- */
function openSheet(id) { document.getElementById(id).classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeSheet(id) {
  document.getElementById(id).classList.remove('open');
  if (!document.querySelector('.backdrop.open')) document.body.style.overflow = '';
}
function closeBayModal() { closeSheet('bayModal'); }

function openBay(id) {
  selectedBayId = id;
  const bay = state.bays.find(b => b.id === id);
  document.getElementById('modalTitle').textContent = `Bay ${pad(id)}`;
  const body = document.getElementById('modalBody');
  const sub = document.getElementById('modalSub');

  if (!bay.occupied) {
    formTier = TIERS.hour;
    formPay = 'Cash';
    sub.textContent = 'New check-in';
    body.innerHTML = `
      <div class="field" id="fCustomer">
        <label for="inpCustomer">Customer name</label>
        <input type="text" id="inpCustomer" placeholder="e.g. Thabo (white bucket hat)" autocomplete="off" autocapitalize="words" enterkeyhint="next" />
        <div class="err">Add a name or something to recognise them by.</div>
      </div>
      <div class="field">
        <label for="inpDevice">Phone & case</label>
        <input type="text" id="inpDevice" placeholder="e.g. iPhone 15 Pro, clear case" autocomplete="off" enterkeyhint="done" />
      </div>
      <div class="field">
        <label>Charging option</label>
        <div class="seg">
          <button type="button" class="opt selected" onclick="selectTier('hour', this)"><span class="big">R30</span><span class="small">1 hour</span></button>
          <button type="button" class="opt" onclick="selectTier('full', this)"><span class="big">R50</span><span class="small">Full charge</span></button>
        </div>
      </div>
      <div class="field">
        <label>Paid upfront with</label>
        <div class="seg">
          <button type="button" class="opt center selected" onclick="selectPay('Cash', this)">💵 Cash</button>
          <button type="button" class="opt center" onclick="selectPay('Card / QR', this)">💳 Card / QR</button>
        </div>
      </div>
      <button type="button" class="btn btn-go" onclick="confirmCheckIn()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        Lock bay & start timer
      </button>`;
    const inp = document.getElementById('inpCustomer');
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); document.getElementById('inpDevice').focus(); } });
    document.getElementById('inpDevice').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } });
  } else {
    renderActiveBay(bay);
  }
  openSheet('bayModal');
}

function renderActiveBay(bay) {
  const info = getBayStatus(bay);
  document.getElementById('modalSub').textContent = `Checked in at ${formatTime(bay.checkInTime)}`;
  const canExtend = bay.durationMins > 0;
  document.getElementById('modalBody').innerHTML = `
    <div class="status-banner ${info.status}">
      <span>${info.status === 'overdue' ? 'Time is up' : (bay.durationMins ? 'Charging' : 'Full charge')}</span>
      <span class="t">${info.text}</span>
    </div>
    ${bay.code ? `
    <div class="code-card">
      <div class="lbl">Pickup code</div>
      <div class="code">${bay.code}</div>
      <div class="hint">Ask the customer for this before handing over</div>
    </div>` : ''}
    <div class="details">
      <div class="row"><span>Customer</span><strong>${escapeHtml(bay.customer)}</strong></div>
      <div class="row"><span>Phone / case</span><strong>${escapeHtml(bay.device || 'Not noted')}</strong></div>
      <div class="row"><span>Option</span><strong>${escapeHtml(bay.tierLabel)}</strong></div>
      <div class="row"><span>Paid</span><strong>R${bay.price} · ${escapeHtml(bay.paymentMethod)}</strong></div>
    </div>
    <div class="note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
      <span>Forgot their PIN? Match the lock screen wallpaper to the phone before using the master key.</span>
    </div>
    ${canExtend ? `<button type="button" class="btn btn-soft" onclick="extendBay(${bay.id})">+1 hour · collect R${EXTEND.price}</button>` : ''}
    <button type="button" class="btn btn-red" onclick="releaseBay(${bay.id})">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      Collected · release bay
    </button>`;
}

function selectTier(key, btn) {
  formTier = TIERS[key];
  btn.parentElement.querySelectorAll('.opt').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

function selectPay(method, btn) {
  formPay = method;
  btn.parentElement.querySelectorAll('.opt').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

function confirmCheckIn() {
  const customer = document.getElementById('inpCustomer').value.trim();
  const device = document.getElementById('inpDevice').value.trim();
  if (!customer) {
    const f = document.getElementById('fCustomer');
    f.classList.add('error');
    document.getElementById('inpCustomer').focus();
    vibrate(80);
    return;
  }

  const bay = state.bays.find(b => b.id === selectedBayId);
  Object.assign(bay, {
    occupied: true,
    customer,
    device,
    tierLabel: formTier.label,
    price: formTier.price,
    durationMins: formTier.mins,
    paymentMethod: formPay,
    checkInTime: Date.now(),
    code: newCode()
  });

  saveState();
  render();
  vibrate(30);

  document.getElementById('modalSub').textContent = 'Locked in';
  document.getElementById('modalBody').innerHTML = `
    <div class="success-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
    <div class="code-card">
      <div class="lbl">Give ${escapeHtml(customer)} this pickup code</div>
      <div class="code">${bay.code}</div>
      <div class="hint">Bay ${pad(bay.id)} · ${escapeHtml(bay.tierLabel)} · ${escapeHtml(bay.paymentMethod)}${bay.durationMins ? ` · back by ${formatTime(bay.checkInTime + bay.durationMins * 60000)}` : ''}</div>
    </div>
    <button type="button" class="btn btn-go" onclick="closeBayModal()">Done</button>`;
}

function extendBay(id) {
  const bay = state.bays.find(b => b.id === id);
  if (!bay || !bay.occupied || !bay.durationMins) return;
  bay.durationMins += EXTEND.mins;
  bay.price += EXTEND.price;
  bay.tierLabel = `${bay.tierLabel.replace(/ \+\d+h ext$/, '')} +${Math.round((bay.durationMins - 60) / 60)}h ext`;
  saveState();
  render();
  renderActiveBay(bay);
  showToast(`Bay ${pad(id)} extended. Collect R${EXTEND.price}.`);
}

function releaseBay(id) {
  const bay = state.bays.find(b => b.id === id);
  if (!bay || !bay.occupied) return;

  const entry = {
    bayId: bay.id, customer: bay.customer, device: bay.device, tierLabel: bay.tierLabel,
    price: bay.price, paymentMethod: bay.paymentMethod, checkInTime: bay.checkInTime,
    releasedTime: Date.now(), code: bay.code || ''
  };
  lastRelease = { bay: { ...bay }, entry };
  state.history.unshift(entry);
  Object.assign(bay, blankBay(bay.id));

  saveState();
  closeBayModal();
  render();
  vibrate(30);
  showToast(`Bay ${pad(id)} is free`, 'Undo', undoRelease, 7000);
}

function undoRelease() {
  if (!lastRelease) return;
  const { bay: saved, entry } = lastRelease;
  const bay = state.bays.find(b => b.id === saved.id);
  if (bay.occupied) { showToast(`Bay ${pad(saved.id)} was already reused`); return; }
  Object.assign(bay, saved);
  const idx = state.history.indexOf(entry);
  if (idx > -1) state.history.splice(idx, 1);
  lastRelease = null;
  saveState();
  render();
  showToast(`Bay ${pad(saved.id)} restored`);
}

/* ---------- History ---------- */
function openHistory() {
  const t = totals();
  const active = state.bays.filter(b => b.occupied).length;
  document.getElementById('histSub').textContent = `${state.history.length} collected · ${active} still charging`;
  const items = state.history.map(h => `
    <div class="log-item">
      <div style="min-width:0">
        <strong>Bay ${pad(h.bayId)} · ${escapeHtml(h.customer)}</strong>
        <div class="sub">${escapeHtml(h.device || 'No note')} · ${formatTime(h.checkInTime)} to ${formatTime(h.releasedTime)}</div>
      </div>
      <div class="amt"><strong>R${h.price}</strong><div class="sub">${escapeHtml(h.paymentMethod)}</div></div>
    </div>`).join('');

  document.getElementById('historyBody').innerHTML = `
    <div class="sum-grid">
      <div class="sum"><div class="v" style="color:var(--green-text)">R${t.total}</div><div class="l">Total</div></div>
      <div class="sum"><div class="v">R${t.cash}</div><div class="l">Cash</div></div>
      <div class="sum"><div class="v">R${t.card}</div><div class="l">Card / QR</div></div>
    </div>
    <div class="section-lbl">Collected</div>
    <div class="log">${items || '<p class="muted-center">No collections yet.</p>'}</div>
    <button class="btn btn-soft" onclick="exportCSV()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      Export CSV
    </button>
    <button class="btn btn-soft" style="color:var(--red-text)" onclick="resetShift()">End shift & reset</button>`;
  openSheet('historyModal');
}

function exportCSV() {
  const rows = [['Status', 'Bay', 'Customer', 'Device', 'Tier', 'Amount_ZAR', 'Payment', 'PickupCode', 'CheckIn', 'Released']];
  state.bays.forEach(b => {
    if (b.occupied) rows.push(['ACTIVE', b.id, b.customer, b.device, b.tierLabel, b.price, b.paymentMethod, b.code || '', formatTime(b.checkInTime), '']);
  });
  state.history.forEach(h => {
    rows.push(['COMPLETED', h.bayId, h.customer, h.device, h.tierLabel, h.price, h.paymentMethod, h.code || '', formatTime(h.checkInTime), formatTime(h.releasedTime)]);
  });
  if (rows.length === 1) { showToast('Nothing to export yet'); return; }

  const csv = rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `chargevault_shift_${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('CSV downloaded');
}

async function resetShift() {
  const t = totals();
  const ok = await askConfirm('End shift and reset?', `This clears all 20 bays and the R${t.total} shift log. Export the CSV first if you need it.`, 'Reset everything');
  if (!ok) return;
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  state = { bays: Array.from({ length: BAY_COUNT }, (_, i) => blankBay(i + 1)), history: [] };
  lastRelease = null;
  saveState();
  closeSheet('historyModal');
  render();
  showToast('New shift started');
}

/* ---------- Confirm + toast ---------- */
let confirmResolve = null;
function askConfirm(title, msg, okLabel) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmMsg').textContent = msg;
  document.getElementById('confirmOk').textContent = okLabel || 'Confirm';
  openSheet('confirmModal');
  return new Promise(res => { confirmResolve = res; });
}
function answerConfirm(v) { closeSheet('confirmModal'); if (confirmResolve) { confirmResolve(v); confirmResolve = null; } }

function showToast(msg, actionLabel, action, ms = 2600) {
  const t = document.getElementById('toast');
  const btn = document.getElementById('toastAction');
  document.getElementById('toastMsg').textContent = msg;
  if (actionLabel) {
    btn.hidden = false; btn.textContent = actionLabel;
    btn.onclick = () => { t.classList.remove('show'); action(); };
  } else { btn.hidden = true; btn.onclick = null; }
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

/* ---------- Keep screen awake during the event ---------- */
let wakeLock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {}
}
document.addEventListener('click', keepAwake, { once: true });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { render(); keepAwake(); } });

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (document.getElementById('confirmModal').classList.contains('open')) answerConfirm(false);
  else ['bayModal', 'historyModal'].forEach(closeSheet);
});

loadState();
render();
setInterval(() => {
  render();
  const m = document.getElementById('bayModal');
  if (m.classList.contains('open') && selectedBayId) {
    const bay = state.bays.find(b => b.id === selectedBayId);
    if (bay && bay.occupied && document.querySelector('#modalBody .status-banner')) renderActiveBay(bay);
  }
}, 15000);
</script>
</body>
